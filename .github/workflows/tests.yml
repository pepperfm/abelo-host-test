name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build
        run: docker compose --profile test build
      - name: Test on PHP 8.5 and MySQL 8.4
        run: docker compose --profile test run --rm tests
      - name: Verify normal startup and Nginx
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/blog.html; then
              grep -q 'Меньше шума' /tmp/blog.html
              curl --fail --silent http://127.0.0.1:8080/categories/1 > /dev/null
              curl --fail --silent http://127.0.0.1:8080/articles/1 > /dev/null
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = 404
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose --profile test down -v

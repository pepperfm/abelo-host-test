server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }
}

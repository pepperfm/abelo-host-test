x-php: &php
  build:
    context: .
    target: app
  environment: &app-environment
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-blog}
    DB_USERNAME: ${DB_USERNAME:-blog}
    DB_PASSWORD: ${DB_PASSWORD:-local_blog_password}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blog}
      MYSQL_USER: ${DB_USERNAME:-blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_blog_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:-blog_test}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/01-test-database.sh:/docker-entrypoint-initdb.d/01-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  init:
    <<: *php
    command: ["sh", "-c", "php bin/init-db.php && php bin/seed.php"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    <<: *php
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  tests:
    <<: *php
    profiles: ["test"]
    environment:
      <<: *app-environment
      DB_DATABASE: ${DB_TEST_DATABASE:-blog_test}
      BLOG_TESTING: "1"
    command: ["sh", "-c", "php bin/lint.php && php tests/unit.php && php tests/integration.php && php tests/http.php"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
